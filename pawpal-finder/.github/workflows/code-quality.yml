name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  checkstyle:
    name: Checkstyle Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Checkstyle
      run: mvn -B checkstyle:check --file pawpal-finder/pom.xml || true

    - name: Generate Checkstyle report
      run: mvn -B checkstyle:checkstyle --file pawpal-finder/pom.xml

    - name: Upload Checkstyle results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: checkstyle-results
        path: pawpal-finder/target/checkstyle-result.xml

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check for dependency vulnerabilities
      run: mvn -B dependency:analyze --file pawpal-finder/pom.xml

    - name: List dependencies
      run: mvn -B dependency:tree --file pawpal-finder/pom.xml

