# Spring Application Name
spring.application.name=pawpal-finder

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# File Upload Configuration
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

# Logging for Vault
logging.level.org.springframework.cloud.vault=DEBUG
logging.level.org.springframework.vault=DEBUG

# Note: The following properties are automatically loaded from Vault:
# - secret.key (from secret/pawpal-finder/jwt)
# - jwt.expirationMs (from secret/pawpal-finder/jwt)
# - google.api.key (from secret/pawpal-finder/google)
# - spring.datasource.url (from secret/pawpal-finder/database)
# - spring.datasource.username (from secret/pawpal-finder/database)
# - spring.datasource.password (from secret/pawpal-finder/database)
