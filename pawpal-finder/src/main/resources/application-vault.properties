# Spring Cloud Vault Configuration
spring.application.name=pawpal-finder

# Vault Configuration
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.app-role.role=pawpal-finder
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=pawpal-finder
spring.cloud.vault.kv.application-name=pawpal-finder

# Fail fast if Vault is not available
spring.cloud.vault.fail-fast=true

# Database Configuration (will be overridden by Vault)
spring.datasource.url=${spring.cloud.vault.kv.pawpal-finder.database.url}
spring.datasource.username=${spring.cloud.vault.kv.pawpal-finder.database.username}
spring.datasource.password=${spring.cloud.vault.kv.pawpal-finder.database.password}

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# JWT Configuration (will be retrieved from Vault)
secret.key=${spring.cloud.vault.kv.pawpal-finder.jwt.secret-key}
jwt.expirationMs=${spring.cloud.vault.kv.pawpal-finder.jwt.expiration-ms}

# Google API Configuration (will be retrieved from Vault)
google.api.key=${spring.cloud.vault.kv.pawpal-finder.google.api-key}

# File Upload Configuration
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

# Logging for Vault
logging.level.org.springframework.cloud.vault=DEBUG
logging.level.org.springframework.vault=DEBUG
