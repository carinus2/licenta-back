# Spring Application Name
spring.application.name=pawpal-finder

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# File Upload Configuration
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

# Logging for Vault
logging.level.org.springframework.cloud.vault=DEBUG
logging.level.org.springframework.vault=DEBUG

# Database Configuration (loaded from Vault: secret/pawpal-finder/database)
spring.datasource.url=${database.url}
spring.datasource.username=${database.username}
spring.datasource.password=${database.password}

# JWT Configuration (loaded from Vault: secret/pawpal-finder/jwt)
secret.key=${jwt.secret-key}
jwt.expirationMs=${jwt.expiration-ms}

# Google API Configuration (loaded from Vault: secret/pawpal-finder/google)
google.api.key=${google.api-key}
