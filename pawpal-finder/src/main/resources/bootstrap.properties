# Bootstrap configuration for Spring Cloud Vault
# This file is loaded before application.properties

spring.application.name=pawpal-finder

# Vault Configuration
spring.cloud.vault.enabled=true
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.authentication=APPROLE
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.app-role.role=pawpal-finder

# KV Secrets Engine Configuration
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=pawpal-finder

# Fail fast if Vault is unavailable
spring.cloud.vault.fail-fast=true

# Connection timeout
spring.cloud.vault.connection-timeout=5000
spring.cloud.vault.read-timeout=15000
