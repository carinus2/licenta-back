version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: pawpal-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config:/vault/config
      - ./vault/data:/vault/data
      - ./vault/logs:/vault/logs
      - ./vault/init:/vault/init
    command: server -dev -dev-root-token-id="dev-root-token"
    networks:
      - pawpal-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: pawpal-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pawpal_db
      POSTGRES_USER: pawpal_user
      POSTGRES_PASSWORD: pawpal_password_temp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pawpal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpal_user -d pawpal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.15
    container_name: pawpal-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
    volumes:
      - ./vault/init:/vault/init
    networks:
      - pawpal-network
    entrypoint: /bin/sh
    command: /vault/init/init-vault.sh

networks:
  pawpal-network:
    driver: bridge

volumes:
  postgres_data:
